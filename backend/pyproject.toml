[project]
name = "mgpa-backend"
version = "0.1.0"
description = "FastAPI backend and Pydantic AI agent for MGPA"
readme = "README.md"
authors = [
    { name = "Moritz Gärtner", email = "213279945+moritzgaertner@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.149.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: pyupgrade,
# SIM: simplifications, S: bandit security checks
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# `assert` is the normal way to write pytest tests
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.alembic]
script_location = "%(here)s/migrations"
# Prefix migration files with the date so they sort chronologically
file_template = "%%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s"

# Lint-fix and format every newly generated migration so CI stays green
[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"


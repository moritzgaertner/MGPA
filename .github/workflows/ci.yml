name: CI

# Run on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only need to read the code.
permissions:
  contents: read

# If a new commit arrives on the same branch, cancel the outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Throwaway database for this run, same image as infra/docker-compose.yml.
    # The credentials only exist inside the CI machine, so they are not secrets.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: mgpa
          POSTGRES_PASSWORD: mgpa
          POSTGRES_DB: mgpa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mgpa -d mgpa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mgpa:mgpa@localhost:5432/mgpa
      # Placeholders only: tests replace Claude with a fake model, CI never calls the API.
      ANTHROPIC_API_KEY: ci-placeholder-not-a-real-key
      ANTHROPIC_MODEL: ci-placeholder-model

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes no floating major tags, only exact versions
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check models and migrations are in sync
        # Fails if a model was changed without generating a migration
        run: uv run alembic check

      - name: Test
        run: uv run pytest

      - name: Check frontend API types are up to date
        # The frontend's types are generated from this schema. If an endpoint changed without
        # running `npm run api:types` in frontend/, this diff fails.
        run: |
          uv run python -m mgpa_backend.export_openapi > /tmp/openapi.json
          diff -u ../frontend/src/api/openapi.json /tmp/openapi.json

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # npm ci installs exactly what package-lock.json pins (the frontend's uv.lock)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
